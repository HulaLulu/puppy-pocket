<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>puppy-pocket</title>
  <link href="/src/style.css" rel="stylesheet">
</head>

<body class="flex flex-col h-screen">
  <header class="bg-cyan-200 text-white italic text-5xl text-center">
    Puppy Pocket
  </header>
  <div class="bg-[url(/img/mountains.jpg)] bg-cover bg-center"></div>

  <main class="flex flex-1">
    <div class="bg-blue-200/50">
      <button class="transition-transform active:translate-y-1" id="clicker">
        <p id="scoreDisplay">PawPrints</p>
        <img
          src="src/assets/cute-cartoon-animal-dog-holding-a-bone-transparent-background-chibi-style-happy-environment-for-kids-free-png.png"
          width="500" height="500">
      </button>
    </div>

    <div class="grid grid-cols-2 gap-4"></div>
    <div class="grid grid-cols-2 gap-4"></div>
    <div class="grid grid-cols-2 gap-4"></div>
    <div class="grid grid-cols-2 gap-4"></div>
    <div class="grid grid-cols-2 gap-4"></div>
    <div class="grid grid-cols-2 gap-4"></div>

    <div class="grid grid-cols-2 gap-1">
      <div class="flex-1 bg-blue-400/50">
        For Hire
        <br>
        <br>
        <div class="bg-blue-500 border-3 border-dotted">
          <button id="upgradeOne" class="transition-transform active:translate-y-1 bg-blue-200"> Eva
            <div class="bg-blue-500 border-3 border-dotted">
              <img src="src/assets/woman-dog-walk-clipart-md.png" width="200" height="200">
            </div>
            <p id="upgradeOneCount"> 0 Eva's</p>
            <p>Cost: 100 PawPrints</p>
          </button>
        </div>
        <br>
        <div class="bg-blue-500 border-3 border-dotted">
          <button id="upgradeTwo" class="transition-transform active:translate-y-1 bg-blue-200"> George
            <div class="bg-blue-500 border-3 border-dotted">
              <img src="src/assets/child-boy-dog-clipart-md.png" width="200" height="200">
            </div>
            <p id="upgradeTwoCount"> 0 George's</p>
            <p>Cost: 2500 PawPrints</p>
          </button>
        </div>
        <br>
        <div class="bg-blue-500 border-3 border-dotted">
          <button id="upgradeThree" class="bg-blue-200 transition-transform active:translate-y-1"> Jonas
            <div class="bg-blue-500 border-3 border-dotted">
              <img src="src/assets/pngtree-confident-man-walking-his-dog-png-image_16412162.png" width="200"
                height="200">
            </div>
            <p> 0 Jonas's</p>
            <p>Cost: 6000 PawPrints</p>
          </button>
        </div>
        <br>
      </div>


      <div class="rounded-xl">
        <div class="flex-1 bg-cyan-300/50">
          Dog Breeds
          <br>
          <br>
          <div class="bg-cyan-200 border-3 border-dotted">
            <button class="transition-transform active:translate-y-1 bg-cyan-100 border-3 border-dotted"> Chihuahua
              <img src="src/assets/8e627d6d9969e1fa636f702a5471ffcc-cute-cartoon-corgi-illustration.webp" width="200"
                height="200">
          </div>
          <p> Cost: 3000 PawPrints </p>
           </button>
          <br>
          <div class="bg-cyan-200 border-3 border-dotted">
            <button class="transition-transform active:translate-y-1 bg-cyan-100 border-3 border-dotted"> Pug
              <img src="src/assets/ad9ced258784770258e09a9fc0f42ea7-cartoon-pug-dog-sitting-down.webp" width="200"
                height="200">
            </button>
          </div>
          <p> Cost: 13000 PawPrints </p>
          <br>
          <div class="bg-cyan-200 border-3 border-dotted">
            <button class="transition-transform active:translate-y-1 bg-cyan-100 border-3 border-dotted"> Great Dane
              <img src="src/assets/99346da7bb4f118b40c49e95dcfde4b6-side-great-dane-dog-illustration.webp" width="200"
                height="200">
            </button>
          </div>
          <p> Cost: 40000 PawPrints </p>
          <br>
  </main>


  <script type="module" src="/src/main.js"></script>
</body>

</html>
